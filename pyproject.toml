[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vagamp-costgov_jd052"
version = "0.1.0"
description = "解析时间标记，排列成本与容量治理专家·多机通信的带宽瓶颈的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vagamp" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vagamp.github.io"
Repository = "https://github.com/vagamp/costgov_jd052"
Issues = "https://github.com/vagamp/costgov_jd052/issues"

[project.scripts]
costgov_jd052 = "costgov_jd052:main"

[tool.setuptools]
py-modules = ["costgov_jd052"]
